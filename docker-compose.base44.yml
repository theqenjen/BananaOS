services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app/backend
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec node --watch server.js"]
    volumes:
      - ./backend:/app/backend
      - bananaos-api-data:/app/data
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - NODE_ENV=development
    labels:
      base44.project: "BananaOS API"
      base44.kind: api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 40s
    restart: on-failure

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    depends_on:
      api:
        condition: service_healthy
    labels:
      base44.project: "BananaOS"
      base44.kind: web
      base44.port: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 60s
    restart: on-failure

volumes:
  bananaos-api-data:
