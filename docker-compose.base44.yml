services:
  bananaos:
    build: .
    working_dir: /app
    command: ["sh", "-c", "exec python3 /app/tools/serve.py"]
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      base44.project: "BananaOS"
      base44.kind: "web"
      base44.port: "3000"
