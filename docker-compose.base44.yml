services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Dependencies live in a named volume, so install from the mounted lockfile-free
    # manifest on boot, then run Vite's dev server against the cloned source.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - CHOKIDAR_USEPOLLING=1
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/ | grep -q 'id=\"root\"' || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 90s
    restart: on-failure
    labels:
      - base44.project=BananaOS
      - base44.kind=web
      - base44.port=3000

volumes:
  node_modules:
