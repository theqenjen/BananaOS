name: bananaos

services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "server.mjs"]
    restart: on-failure
    environment:
      - NODE_ENV=development
      - PORT=8000
    volumes:
      - ./api:/app
    labels:
      base44.project: "BananaOS Network"
      base44.kind: "api"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund --prefer-offline && exec npm run dev"]
    restart: on-failure
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=1
      - API_TARGET=http://api:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    labels:
      base44.project: "BananaOS"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 60s

volumes:
  web_node_modules:
